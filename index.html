<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pias Ahmed · 2210869121</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#17274a; --navy-2:#2b3f6b; --burgundy:#7a1f2e; --gold:#b08d3c;
  --paper:#f8f7f3; --sheet:#fffffd; --ink:#1c2230; --muted:#626a78; --rule:#cfcbbf; --rule-soft:#e6e3d9;
  --serif:'Libre Baskerville',Georgia,'Times New Roman',serif; --body:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--burgundy);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}

/* Header */
.mast{background:var(--sheet);border-bottom:4px double var(--navy);position:sticky;top:0;z-index:50}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:78px}
.id{display:flex;align-items:center;gap:14px}
.seal{width:46px;height:46px;flex:none}
.brand{font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--navy);line-height:1.15}
.brand small{display:block;font-family:var(--body);font-size:.88rem;font-weight:500;color:var(--muted);letter-spacing:.1em;margin-top:3px}
.nav{display:flex;align-items:center;gap:4px}
.nav button.link{background:none;border:0;color:var(--navy);font-size:1rem;font-weight:500;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.nav button.link:hover{color:var(--burgundy)}
.nav button.link[aria-selected="true"]{color:var(--burgundy);border-bottom-color:var(--burgundy)}
.burger{display:none;width:44px;height:44px;background:none;border:1px solid var(--navy);border-radius:2px;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.burger span{display:block;width:20px;height:2px;background:var(--navy);transition:.25s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* Layout */
main{padding:46px 0 80px}
.panel{display:none}.panel.on{display:block}
.head{margin-bottom:30px;text-align:center}
